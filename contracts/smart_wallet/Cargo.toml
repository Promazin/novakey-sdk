[package]
name = "smart-wallet"
version = "0.1.0"
edition = "2021"
description = "NovaKey Soroban smart wallet contract with secp256r1 passkey authentication"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "21.7.1", features = ["alloc", "testutils"] }
