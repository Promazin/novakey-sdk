[package]
name = "novakey-tests"
version = "0.1.0"
edition = "2021"
description = "Integration and unit tests for NovaKey Soroban contracts"
license = "MIT"

[dev-dependencies]
soroban-sdk  = { version = "21.7.1", features = ["alloc", "testutils"] }
smart-wallet = { path = "../smart_wallet" }
factory      = { path = "../factory" }
# Cryptographic helpers for constructing real secp256r1 test signatures
p256         = { version = "0.13.2", features = ["ecdsa"] }
sha2         = { version = "0.10.8" }

[[test]]
name = "test_registration"
path = "test_registration.rs"

[[test]]
name = "test_passkey_verification"
path = "test_passkey_verification.rs"

[[test]]
name = "test_factory"
path = "test_factory.rs"

[[test]]
name = "test_recovery"
path = "test_recovery.rs"
